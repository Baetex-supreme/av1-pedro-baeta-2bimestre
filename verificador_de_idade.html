<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificador de idade</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="age-page">
    <main class="age-checker container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <section class="age-card">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
              <div>
                <span class="badge bg-success-subtle text-success-emphasis px-3 py-2">Validação</span>
                <h1 class="mt-3">Verificador de idade</h1>
              </div>
              <a href="index.html" class="btn btn-outline-secondary btn-sm">Voltar ao início</a>
            </div>

            <p class="subtitle">
              Informe o nome e a data de nascimento para verificar se a pessoa é maior ou menor de idade.
            </p>

            <form id="formIdade" novalidate>
              <div class="field-group">
                <label for="nome">Nome</label>
                <input
                  type="text"
                  id="nome"
                  class="form-control"
                  placeholder="Digite o nome completo"
                />
              </div>

              <div class="field-group">
                <label for="dataNascimento">Data de nascimento</label>
                <input
                  type="date"
                  id="dataNascimento"
                  class="form-control"
                />
              </div>

              <div class="d-flex flex-wrap gap-2 mt-4">
                <button id="botao" type="submit" class="btn btn-primary">Verificar idade</button>
                <button id="limpar" type="button" class="btn btn-outline-secondary">Limpar</button>
              </div>
            </form>

            <div id="resultado" class="resultado neutral" aria-live="polite">
              Preencha os dados para continuar.
            </div>

            <div class="history">
              <h2>Histórico</h2>
              <ul id="historico" class="list-group"></ul>
            </div>
          </section>
        </div>
      </div>
    </main>

    <nav>
      <a href="index.html">início</a>
      <a href="sobre.html">sobre</a>
      <a href="contato.html">contato</a>
      <a href="habilidades.html">habilidades</a>
      <a href="jogos.html">jogos</a>
      <a href="galeria.html">galeria</a>
      <a href="destaque.html">destaque</a>
      <a href="financas.html">finanças</a>
      <a href="verificador_de_idade.html">idade</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </body>
</html>
