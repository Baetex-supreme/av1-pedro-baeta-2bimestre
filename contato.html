    <main>
      <section class="bg-color">
        <div class="content-box">
          <h2>Contato</h2>
          <p>Entre em contato comigo para falar sobre ideias, projetos e novidades.</p>

          <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required />

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>

            <label for="nova-senha">Nova senha:</label>
            <input type="password" id="nova-senha" name="nova-senha" placeholder="Digite sua nova senha" required />

            <button type="submit">Enviar</button>
          </form>
        </div>
      </section>
    </main>
